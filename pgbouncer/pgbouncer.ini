[databases]
# Coordinator connections via HAProxy with different port strategies
citus_ddn = host=haproxy port=5400 dbname=citus_db pool_size=20 max_db_connections=25
pgbench_ddn = host=haproxy port=5400 dbname=pgbench_db pool_size=15 max_db_connections=20

citus_rw = host=haproxy port=5500 dbname=citus_db pool_size=20 max_db_connections=25
citus_ro = host=haproxy port=5501 dbname=citus_db pool_size=15 max_db_connections=20

# PostgreSQL system database connections
postgres_ddl = host=haproxy port=5400 dbname=postgres pool_size=10 max_db_connections=15
postgres_ro = host=haproxy port=5401 dbname=postgres pool_size=10 max_db_connections=15

# Worker connections via HAProxy (port 5500)
citus_rw = host=haproxy port=5500 dbname=citus_db pool_size=20 max_db_connections=25

# Worker connections via HAProxy (port 5501)
citus_ro = host=haproxy port=5501 dbname=citus_db pool_size=20 max_db_connections=25

# Direct coordinator connections (bypassing HAProxy) for specific operations
citus_coord1_di= host=postgres_coord1 port=5432 dbname=citus_db pool_size=5 max_db_connections=10
citus_coord2_di = host=postgres_coord2 port=5432 dbname=citus_db pool_size=5 max_db_connections=10
citus_coord3_di = host=postgres_coord3 port=5432 dbname=citus_db pool_size=5 max_db_connections=10

# Direct worker connections (bypassing HAProxy) for maintenance
citus_worker1_di = host=postgres_work1-1 port=5432 dbname=citus_db pool_size=5 max_db_connections=10
citus_worker2_di = host=postgres_work1-2 port=5432 dbname=citus_db pool_size=5 max_db_connections=10
citus_worker3_di = host=postgres_work2-1 port=5432 dbname=citus_db pool_size=5 max_db_connections=10
citus_worker4_di = host=postgres_work2-2 port=5432 dbname=citus_db pool_size=5 max_db_connections=10

# Wildcard fallback for dynamic database creation
#* = host=haproxy port=5400 pool_size=5

[pgbouncer]
# Network Configuration
listen_addr = 0.0.0.0
listen_port = 6432

# Additional ports for different services
# You can configure multiple pgbouncer instances on different ports
# listen_addresses = 0.0.0.0:6432,0.0.0.0:6433,0.0.0.0:6434

# Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
stats_users = postgres

# Connection Pooling
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 5
max_db_connections = 100
max_user_connections = 100

# Connection Management
server_reset_query = DISCARD ALL
server_check_delay = 10
server_check_query = SELECT 1
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 0
client_login_timeout = 60

# Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# Performance Tuning for Multiple HAProxy Backends
tcp_defer_accept = 45
tcp_socket_buffer = 0
tcp_keepalive = 1
tcp_keepcnt = 9
tcp_keepidle = 7200
tcp_keepintvl = 75

# Ignore startup parameters that aren't important
ignore_startup_parameters = extra_float_digits,application_name

# Allow only specific databases and add hostname to application name
application_name_add_host = 1
conffile = /etc/pgbouncer/pgbouncer.ini

# Citus-specific settings
server_reset_query_always = 0

# DNS resolution for dynamic discovery
dns_max_ttl = 15
dns_zone_check_period = 0