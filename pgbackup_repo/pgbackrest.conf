[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
repo1-retention-diff=7
# Allow multiple Citus nodes to connect at once
process-max=4
log-level-console=info
lock-path=/var/lib/pgbackrest/lock

[citus_coord]
# We point to the Coordinator Primary (adjust name as per your compose)
pg1-host=postgres_coord1
pg1-path=/var/lib/postgresql/data/pgdata
pg1-host-user=postgres
pg1-port=5432
pg1-host-port=2222


[citus_worker1]
# We point to the Worker Primary (adjust name as per your compose)
pg1-host=postgres_work1-1
pg1-path=/var/lib/postgresql/data/pgdata
pg1-host-user=postgres
pg1-port=5432
pg1-host-port=2222

[citus_worker2]
# We point to the Worker Primary (adjust name as per your compose)
pg1-host=postgres_work2-1
pg1-path=/var/lib/postgresql/data/pgdata
pg1-host-user=postgres
pg1-port=5432
pg1-host-port=2222