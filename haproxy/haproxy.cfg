global
  log stdout format raw local0
  maxconn 4096

defaults
  log     global
  mode    tcp
  option  dontlognull
  timeout connect 5s
  timeout client  60s
  timeout server  60s

# Docker DNS resolver (DEFINE ONCE)
resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry   1s
  hold valid 10s

# Statistics interface
listen stats
  bind *:5000
  mode http
  stats enable
  stats uri /stats
  stats refresh 30s
  stats admin if TRUE 

# Frontend for coordinator admin/maintenance (round-robin)
frontend postgres_coord_health
  bind *:5402
  default_backend postgres_coord_health

# Frontend for coordinator read-write connections (primary only)
frontend postgres_coord_leader
  bind *:5400
  default_backend postgres_coord_leader

# Frontend for coordinator read-only connections (any available coordinator)
frontend postgres_coord_replica
  bind *:5401
  default_backend postgres_coord_replica

# Frontend for direct coordinator access (specific node targeting)
# frontend postgres_coord_direct
#   bind *:5403
#   default_backend postgres_coord_direct

# Frontend for worker connections (load balanced)
frontend postgres_workers_leader
  bind *:5500
  default_backend postgres_workers_leader

frontend postgres_workers_replica
  bind *:5501
  default_backend postgres_workers_replica

# Backend for coordinator health checks (admin/maintenance)
backend postgres_coord_health
  #option httpchk GET /health
  option httpchk OPTIONS /health
  http-check expect status 200
  default-server inter 5s fall 2 rise 2 resolvers docker init-addr none
  balance roundrobin
  
  server coord1 coord1:5432 check port 8008
  server coord2 coord2:5432 check port 8008
  server coord3 coord3:5432 check port 8008

# Backend for coordinator primary (read-write) - only active master
backend postgres_coord_leader
  #option httpchk GET /primary
  option httpchk OPTIONS /leader
  http-check expect status 200
  #default-server inter 3s fall 3 rise 2 resolvers docker init-addr none
  default-server inter 3s fall 3 rise 2 resolvers docker init-addr none
  
  server coord1 coord1:5432 check port 8008 
  server coord2 coord2:5432 check port 8008 
  server coord3 coord3:5432 check port 8008 

# Backend for coordinator read-only - only active replicas
backend postgres_coord_replica
  #option httpchk GET /replica
  option httpchk OPTIONS /replica
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 resolvers docker init-addr none
  balance roundrobin
  
  server coord1 coord1:5432 check port 8008
  server coord2 coord2:5432 check port 8008
  server coord3 coord3:5432 check port 8008


# Backend for direct coordinator access - specific targeting
# backend postgres_coord_direct
#   default-server inter 5s fall 2 rise 2 resolvers docker init-addr none
#   balance first
# 
#   server coord1 coord1:5432 check port 8008
#   server coord2 coord2:5432 check port 8008
#   server coord3 coord3:5432 check port 8008

# Backend for workers - health checks
backend postgres_workers_health
  option httpchk OPTIONS /health
  http-check expect status 200
  default-server inter 5s fall 2 rise 2 resolvers docker init-addr none
  balance roundrobin
  
  server worker1 work1-1:5432 check port 8008
  server worker2 work1-2:5432 check port 8008
  server worker3 work2-1:5432 check port 8008
  server worker4 work2-2:5432 check port 8008
  server worker5 work1-3:5432 check port 8008
  server worker6 work1-4:5432 check port 8008

# Backend for workers - distributed across all worker nodes
backend postgres_workers_leader
  option httpchk OPTIONS /leader
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 resolvers docker init-addr none
  balance roundrobin

  server worker1 work1-1:5432 check port 8008
  server worker2 work1-2:5432 check port 8008
  server worker3 work2-1:5432 check port 8008
  server worker4 work2-2:5432 check port 8008
  server worker5 work1-3:5432 check port 8008
  server worker6 work1-4:5432 check port 8008

# Backend for workers read-only - any healthy worker
backend postgres_workers_replica
  option httpchk OPTIONS /replica
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 resolvers docker init-addr none
  balance roundrobin
  
  server worker1 work1-1:5432 check port 8008
  server worker2 work1-2:5432 check port 8008
  server worker3 work2-1:5432 check port 8008
  server worker4 work2-2:5432 check port 8008
  server worker5 work1-3:5432 check port 8008
  server worker6 work1-4:5432 check port 8008

# Note: Adjust server names and ports as per your actual Docker service names and Patroni REST API ports.
