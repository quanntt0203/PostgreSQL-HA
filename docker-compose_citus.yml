networks:
  citus_net:
    driver: bridge

volumes:
  etcd_data:
  coord1_data:
  coord2_data:
  coord3_data:
  work1_1_data:
  work1_2_data:
  work1_3_data:
  work1_4_data:
  work2_1_data:
  work2_2_data:

services:
  # ===== ETCD for cluster coordination =====
  etcd:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: citus_etcd
    networks: [citus_net]
    ports:
      - "12379:2379"
      - "12380:2380"
    volumes:
      - etcd_data:/etcd-data:rw
    command: 
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd=http://etcd:2380
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://localhost:2379"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== COORDINATOR NODES (Group 0) =====
  coord1:
    image: citus-postgres16-backrest:1.2
    container_name: postgres_coord1
    hostname: postgres_coord1
    networks: 
      citus_net:
        aliases:
          - postgres_coord1
    ports:
      - "5432:5432"  # Primary coordinator port
    volumes:
      - coord1_data:/var/lib/postgresql/data
      - ./patroni/coord-base.yml:/etc/patroni/patroni.yml
      - ./pgbackrest/pgbackrest_coord.conf:/etc/pgbackrest/pgbackrest.conf:rw
      - ./logs/patroni_coord1:/var/log/patroni:rw
      - ./logs/postgresql_coord1:/var/log/postgresql:rw
      - ./ssh_keys/authorized_keys:/var/lib/postgresql/.ssh/authorized_keys:ro
      
    environment:
      PATRONI_NAME: citus_coord1
      PATRONI_SCOPE: citus_cluster_mmr
      PATRONI_ETCD3_HOSTS: etcd:2379
      PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres_coord1:5432
      PATRONI_POSTGRESQL_DATA_DIR: /var/lib/postgresql/data/pgdata
      PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres_coord1:8008
      PATRONI_CITUS_GROUP: 0
      PATRONI_CITUS_DATABASE: citus_db
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpass
      
    depends_on:
      etcd:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["/etc/patroni/patroni.yml"] # Ensure config is mapped or use Env vars

