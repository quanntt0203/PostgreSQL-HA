  # ===== HAProxy Load Balancer for Coordinators =====
  haproxy:
    image: haproxy:2.9
    container_name: citus_haproxy
    networks: [citus_net]
    ports:
      - "5000:5000"  # HAProxy stats
      - "5400:5400"  # Load balanced PostgreSQL coordinator port
      - "5500:5500"  # Load balanced PostgreSQL worker port
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===== PgBouncer Connection Pooling =====
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: citus_pgbouncer
    networks: [citus_net]
    ports:
      - "6432:6432"  # PgBouncer port
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    # depends_on:
    #   - haproxy
    environment:
      DATABASES_HOST: haproxy
      DATABASES_PORT: 5400
      POOL_MODE: session
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "haproxy", "-p", "6432"]
      interval: 10s
      timeout: 5s
      retries: 3